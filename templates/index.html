<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Kriptografi AES-256-GCM</title>
</head>
<body>
    <h1>Aplikasi Kriptografi AES-256-GCM</h1>
    <p>Enkripsi dan dekripsi file menggunakan password.</p>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    <form method="POST" enctype="multipart/form-data">
        <p>
            <label for="file">Pilih file:</label><br>
            <input type="file" id="file" name="file" required>
        </p>

        <p>
            <label for="password">Password:</label><br>
            <input
                type="password"
                id="password"
                name="password"
                required
            >
        </p>

        <button type="submit" name="action" value="encrypt">
            Enkripsi File
        </button>

        <button type="submit" name="action" value="decrypt">
            Dekripsi File
        </button>
    </form>
</body>
</html>
